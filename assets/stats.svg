<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 124" width="1200" height="124" role="img" aria-label="3+ years in applied AI, 10+ systems in production, 7 Microsoft certifications, 3 AI hackathons and workshops">
  <defs>
    <linearGradient id="n" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset=".5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
    <clipPath id="k"><rect width="276" height="120" rx="16"/></clipPath>
    <g id="card">
      <rect width="276" height="120" rx="16" fill="#0b1220" stroke="#1e2a44" stroke-width="1.5"/>
      <g clip-path="url(#k)"><rect y="0" width="120" height="2.5" fill="url(#shine)" x="-120"><animate attributeName="x" values="-120;276" dur="3.2s" repeatCount="indefinite"/></rect></g>
    </g>
  </defs>
  <style>
    .v{font:800 42px -apple-system,"Segoe UI",Ubuntu,Helvetica,Arial,sans-serif;fill:url(#n)}
    .l{font:500 15px -apple-system,"Segoe UI",Ubuntu,Helvetica,Arial,sans-serif;fill:#94a3b8}
    g.c{animation:up .9s ease-out both}
    g.c2{animation-delay:.15s}g.c3{animation-delay:.3s}g.c4{animation-delay:.45s}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  </style>
  <g transform="translate(0 2)">
    <g class="c"><use href="#card"/><text class="v" x="138" y="62" text-anchor="middle">3+</text><text class="l" x="138" y="94" text-anchor="middle">Years in applied AI</text></g>
    <g transform="translate(308 0)"><g class="c c2"><use href="#card"/><text class="v" x="138" y="62" text-anchor="middle">10+</text><text class="l" x="138" y="94" text-anchor="middle">Systems in production</text></g></g>
    <g transform="translate(616 0)"><g class="c c3"><use href="#card"/><text class="v" x="138" y="62" text-anchor="middle">7</text><text class="l" x="138" y="94" text-anchor="middle">Microsoft certifications</text></g></g>
    <g transform="translate(924 0)"><g class="c c4"><use href="#card"/><text class="v" x="138" y="62" text-anchor="middle">3</text><text class="l" x="138" y="94" text-anchor="middle">AI hackathons &amp; workshops</text></g></g>
  </g>
</svg>
